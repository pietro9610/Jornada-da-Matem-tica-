<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frações: Nível A (Conceitos)</title>
    <style>
        :root { 
            --bg: #0d1117; 
            --card: #161b22; 
            --primary: #58a6ff; 
            --success: #3fb950; 
            --error: #f85149; 
            --text: #c9d1d9; 
            --text-dim: #8b949e;
            --border: #30363d;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 600px; }

        .nav-back { 
            display: inline-block; 
            margin-bottom: 20px; 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: bold;
            font-size: 0.9rem;
        }

        header { text-align: center; margin-bottom: 30px; }
        
        h1 { 
            color: var(--success); 
            font-size: 1.8rem; 
            margin-bottom: 10px;
        }

        .card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px;
        }

        .question-text { font-size: 1.1rem; margin-bottom: 15px; display: block; }

        input { 
            background: #0d1117; 
            border: 1px solid var(--border); 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--success); }

        button { 
            background: var(--success); 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
            width: 100%; 
            margin-top: 12px;
        }

        button:hover { opacity: 0.9; }

        .feedback { 
            margin-top: 15px; 
            padding: 12px; 
            border-radius: 8px; 
            display: none; 
            font-size: 0.9rem; 
            line-height: 1.4;
        }

        .correct { background: rgba(63, 185, 80, 0.1); color: var(--success); border: 1px solid var(--success); }
        .wrong { background: rgba(248, 81, 73, 0.1); color: var(--error); border: 1px solid var(--error); }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-back">← Voltar ao Menu</a>
    
    <header>
        <h1>Frações Básicas</h1>
        <p style="color: var(--text-dim)">Nível A: Conceitos e Identificação</p>
    </header>
    
    <div id="quiz-container"></div>
</div>

<script>
    const questions = [
        { q: "Se uma pizza é cortada em 8 fatias e você come 3, qual a fração que representa o que você comeu?", a: "3/8", hint: "O numerador é o que você pegou, o denominador é o total de fatias." },
        { q: "Qual o resultado de 1/2 + 1/2?", a: "1", hint: "Duas metades formam um inteiro." },
        { q: "Simplifique a fração 5/10.", a: "1/2", hint: "Divida o de cima e o de baixo pelo mesmo número (5)." },
        { q: "Como escrevemos 'três quartos' em números?", a: "3/4", hint: "Três em cima, quatro em baixo." },
        { q: "Se eu tenho 1/4 de um chocolate e ganho mais 2/4, com quanto fico?", a: "3/4", hint: "Mantenha o denominador e some os numeradores." },
        { q: "Numa sala com 10 pessoas, 4 são homens. Qual a fração de homens?", a: "4/10", hint: "Pode ser 4/10 ou simplificada para 2/5." },
        { q: "Qual fração é maior: 1/2 ou 1/4?", a: "1/2", hint: "Pense: prefere metade de um bolo ou a quarta parte?" },
        { q: "Converta 0,5 para fração simplificada.", a: "1/2", hint: "0,5 é a mesma coisa que metade." },
        { q: "O que representa o número de baixo em uma fração?", a: "denominador", hint: "Começa com 'D'. Indica em quantas partes o todo foi dividido." },
        { q: "Simplifique 10/20.", a: "1/2", hint: "Corte os zeros ou divida por 10." },
        { q: "Se um tanque tem 1/3 de água, quanto falta para encher (fração)?", a: "2/3", hint: "Faltam 2 partes de um total de 3." },
        { q: "Quanto é 1/2 de 20?", a: "10", hint: "Basta dividir 20 por 2." },
        { q: "Quanto é 1/4 de 100?", a: "25", hint: "Divida 100 por 4." },
        { q: "Numa fração, como se chama o número que fica em cima?", a: "numerador", hint: "Começa com 'N'." },
        { q: "Qual o dobro de 1/2?", a: "1", hint: "1/2 + 1/2 ou 2 * 1/2." },
        { q: "Se dividirmos um bolo em 5 partes iguais, cada parte representa qual fração?", a: "1/5", hint: "Uma parte de cinco." },
        { q: "Verdadeiro ou Falso: 2/4 é igual a 1/2?", a: "verdadeiro", hint: "Simplifique 2/4 dividindo por 2." },
        { q: "Quanto é 3/3 de uma maçã?", a: "1", hint: "Quando o de cima é igual ao de baixo, temos o inteiro." },
        { q: "Se eu comer 1/4 de uma barra de 12 quadradinhos, quantos quadrados comi?", a: "3", hint: "12 dividido por 4." },
        { q: "Como se lê a fração 1/10?", a: "um décimo", hint: "Relacionado ao número 10." }
    ];

    const container = document.getElementById('quiz-container');

    questions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        // Para questões de texto, mudamos o input para 'text' em vez de 'number'
        const inputType = isNaN(item.a.replace('/', '')) ? 'text' : 'text';
        card.innerHTML = `
            <span class="question-text"><b>Questão ${index + 1}:</b> ${item.q}</span>
            <input type="${inputType}" id="input-${index}" placeholder="Sua resposta...">
            <button onclick="check(${index})">Verificar</button>
            <div id="feedback-${index}" class="feedback"></div>
        `;
        container.appendChild(card);
    });

    function check(i) {
        const val = document.getElementById(`input-${i}`).value.trim().toLowerCase();
        const f = document.getElementById(`feedback-${i}`);
        f.style.display = "block";
        
        if(val == questions[i].a.toLowerCase()) {
            f.innerHTML = "✅ <b>Correto!</b> Muito bem.";
            f.className = "feedback correct";
        } else {
            f.innerHTML = "❌ <b>Tente novamente.</b> " + questions[i].hint;
            f.className = "feedback wrong";
        }
    }
</script>

</body>
</html>
