<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potência e Raiz: Nível B</title>
    <style>
        :root { 
            --bg: #0d1117; 
            --card: #161b22; 
            --primary: #58a6ff; 
            --success: #3fb950; 
            --error: #f85149; 
            --warning: #d29922;
            --text: #c9d1d9; 
            --text-dim: #8b949e;
            --border: #30363d;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 600px; }

        .nav-back { 
            display: inline-block; 
            margin-bottom: 20px; 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: bold;
            font-size: 0.9rem;
        }

        header { text-align: center; margin-bottom: 30px; }
        
        h1 { 
            color: var(--warning); 
            font-size: 1.8rem; 
            margin-bottom: 10px;
        }

        .card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px;
        }

        .question-text { font-size: 1.1rem; margin-bottom: 15px; display: block; line-height: 1.6; }
        
        .exp { vertical-align: super; font-size: 0.8em; color: var(--warning); }

        input { 
            background: #0d1117; 
            border: 1px solid var(--border); 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--warning); }

        button { 
            background: var(--warning); 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
            width: 100%; 
            margin-top: 12px;
        }

        button:hover { opacity: 0.9; }

        .feedback { 
            margin-top: 15px; 
            padding: 12px; 
            border-radius: 8px; 
            display: none; 
            font-size: 0.9rem; 
            line-height: 1.4;
        }

        .correct { background: rgba(63, 185, 80, 0.1); color: var(--success); border: 1px solid var(--success); }
        .wrong { background: rgba(248, 81, 73, 0.1); color: var(--error); border: 1px solid var(--error); }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-back">← Voltar ao Menu</a>
    
    <header>
        <h1>Potência e Raiz (Intermediário)</h1>
        <p style="color: var(--text-dim)">Nível B: Propriedades e Raízes Superiores</p>
    </header>
    
    <div id="quiz-container"></div>
</div>

<script>
    const questions = [
        { q: "Quanto é 2<span class='exp'>-1</span> em decimal?", a: "0.5", hint: "Dica: Expoente negativo inverte a base. 2⁻¹ = 1/2." },
        { q: "Qual o valor da raiz cúbica de 8 (∛8)?", a: "2", hint: "Dica: Qual número multiplicado por ele mesmo 3 vezes dá 8?" },
        { q: "Simplifique a expressão: 2<span class='exp'>2</span> x 2<span class='exp'>3</span>. Qual o resultado final?", a: "32", hint: "Dica: Mantenha a base e some os expoentes (2⁵)." },
        { q: "Quanto é 10<span class='exp'>-2</span> em decimal?", a: "0.01", hint: "Dica: 10⁻² é o mesmo que 1/100." },
        { q: "Qual o valor de (-3)<span class='exp'>2</span>?", a: "9", hint: "Dica: Base negativa com expoente par fica positiva. (-3) x (-3)." },
        { q: "Quanto é (-2)<span class='exp'>3</span>?", a: "-8", hint: "Dica: Base negativa com expoente ímpar permanece negativa." },
        { q: "Qual o valor de √144?", a: "12", hint: "Dica: 12 x 12 = 144." },
        { q: "Quanto é 4<span class='exp'>3</span>?", a: "64", hint: "Dica: 4 x 4 x 4." },
        { q: "Resolva: 5<span class='exp'>4</span> ÷ 5<span class='exp'>2</span>. Qual o resultado final?", a: "25", hint: "Dica: Mantenha a base e subtraia os expoentes (5²)." },
        { q: "Qual o valor de ∛27?", a: "3", hint: "Dica: 3 x 3 x 3 = 27." },
        { q: "Quanto é (2<span class='exp'>2</span>)<span class='exp'>3</span>?", a: "64", hint: "Dica: Potência de potência, multiplique os expoentes (2⁶)." },
        { q: "Escreva 5.000 em notação científica: 5 x 10 elevado a quanto?", a: "3", hint: "Dica: Conte quantos zeros existem após o 5." },
        { q: "Quanto é √0,25?", a: "0.5", hint: "Dica: Pense que 0,5 x 0,5 = 0,25." },
        { q: "Qual o valor de 11<span class='exp'>2</span>?", a: "121", hint: "Dica: 11 x 11." },
        { q: "Quanto é ∛125?", a: "5", hint: "Dica: 5 x 5 x 5 = 125." },
        { q: "Resolva: √100 + √36", a: "16", hint: "Dica: Calcule as raízes primeiro e depois some (10 + 6)." },
        { q: "Quanto é 2<span class='exp'>-2</span> em decimal?", a: "0.25", hint: "Dica: É o mesmo que 1/2², ou seja, 1/4." },
        { q: "Qual o valor de √169?", a: "13", hint: "Dica: 13 x 13." },
        { q: "Quanto é 9<span class='exp'>1/2</span>?", a: "3", hint: "Dica: Expoente fracionário 1/2 é o mesmo que Raiz Quadrada." },
        { q: "Qual o valor de 0,1<span class='exp'>2</span>?", a: "0.01", hint: "Dica: 0,1 x 0,1." }
    ];

    const container = document.getElementById('quiz-container');

    questions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <span class="question-text"><b>${index + 1}.</b> ${item.q}</span>
            <input type="text" id="input-${index}" placeholder="Sua resposta...">
            <button onclick="check(${index})">Verificar</button>
            <div id="feedback-${index}" class="feedback"></div>
        `;
        container.appendChild(card);
    });

    function check(i) {
        const val = document.getElementById(`input-${i}`).value.trim().replace(',', '.');
        const f = document.getElementById(`feedback-${i}`);
        f.style.display = "block";
        
        if(val === questions[i].a || parseFloat(val) === parseFloat(questions[i].a)) {
            f.innerHTML = "✅ <b>Correto!</b> Seu raciocínio está afiado.";
            f.className = "feedback correct";
        } else {
            f.innerHTML = "❌ <b>Quase!</b> " + questions[i].hint;
            f.className = "feedback wrong";
        }
    }
</script>

</body>
</html>
